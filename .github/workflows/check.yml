name: fare-check

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANNOUNCE_ONLINE: "0"
      CHECK_INTERVAL_HOURS: "2"
      PRICE_DROP_THRESHOLD: "50"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore price state
        uses: actions/cache@v4
        with:
          path: prices.json
          key: prices-${{ github.run_id }}
          restore-keys: |
            prices-

      - run: npm ci

      - run: npm run build

      - name: Configure git for route sync
        run: |
          git config --global user.name "bus-fare-bot"
          git config --global user.email "bus-fare-bot@users.noreply.github.com"

      - name: Run bot (check on start, poll for commands)
        run: node dist/bot.js

      - name: Save city id cache
        run: |
          if [ -n "$(git status --porcelain city-ids.json)" ]; then
            git add city-ids.json
            git commit -m "Update city id cache" || true
            git pull --rebase --autostash || true
            git push || true
          fi
